server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/static/vue;
    index index.html;

    # Vue SPA - serve index.html for all routes except /api, /admin, /static, /media
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle 404s
    error_page   404  /index.html;
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
