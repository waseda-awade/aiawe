log:
  level: DEBUG

entryPoints:
  web:
    # http
    address: ':80'

  web-secure:
    # https
    address: ':443'

  flower:
    address: ':5555'

certificatesResolvers:
  letsencrypt:
    # https://doc.traefik.io/traefik/https/acme/#lets-encrypt
    acme:
      email: 'gayed@waseda.jp'
      storage: /etc/traefik/acme/acme.json
      # https://doc.traefik.io/traefik/https/acme/#httpchallenge
      httpChallenge:
        entryPoint: web

http:
  routers:
    # Django API and Admin routes
    django-router:
      rule: 'Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/static`) || PathPrefix(`/media`) || PathPrefix(`/send-email`))'
      entryPoints:
        - web
      middlewares:
        - csrf
      service: django

    # Vue frontend - catch all other routes
    vue-router:
      rule: 'Host(`localhost`)'
      entryPoints:
        - web
      service: nginx
      priority: 1  # Lower priority means this route is checked last

    flower-secure-router:
      rule: 'Host(`localhost`)'
      entryPoints:
        - flower
      service: flower

  middlewares:
    csrf:
      headers:
        hostsProxyHeaders: ['X-CSRFToken']

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000

    flower:
      loadBalancer:
        servers:
          - url: http://flower:5555

    nginx:
      loadBalancer:
        servers:
          - url: http://nginx:80

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
